<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's new</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="whats-new.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <img src="../icons/icon48.png" width="40" height="40" alt="">
      <div>
        <p id="product" class="product"></p>
        <h1>What's new</h1>
      </div>
    </header>

    <p id="updated-from" class="updated-from" hidden></p>
    <div id="latest"></div>

    <section id="earlier" class="earlier" hidden>
      <h2>Earlier updates</h2>
      <div id="earlier-list"></div>
    </section>

    <footer class="page-footer">
      <label class="toggle">
        <input id="on-update" type="checkbox" checked>
        Open this page after updates
      </label>
      <a href="https://github.com/TheBabu/Simple-Usage-Tracker-for-ChatGPT/releases" target="_blank" rel="noopener">All releases on GitHub</a>
    </footer>
  </main>

  <script src="../shared/changelog.js"></script>
  <script src="whats-new.js"></script>
</body>
</html>
