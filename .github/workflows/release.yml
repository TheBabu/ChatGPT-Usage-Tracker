# Builds the extension zip on every pull request. A version tag (v1.2.3) or a manual run ("Run
# workflow" on the Actions tab) publishes it as a GitHub release; a manual run tags the commit with
# the manifest version itself. See RELEASING.md.
name: Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      - name: Check the version hasn't been released
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump the version in manifest.json first."
            exit 1
          fi

      - name: Build
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: simple-tracker-for-chatgpt
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          gh release create "$tag" dist/*.zip --title "$tag" --target "$GITHUB_SHA" --generate-notes
