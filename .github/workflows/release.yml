# Tests and builds the extension zip on every pull request, and publishes a GitHub release whenever a
# push to main changes the version in manifest.json. See RELEASING.md.
name: Release

on:
  pull_request:
  push:
    branches: [main]
    paths: [manifest.json]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags, to find the last release for the notes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A push that touches manifest.json without changing the version publishes nothing.
      - name: Check for a new version
        id: version
        if: github.event_name == 'push'
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # The unit tests need nothing installed. The end-to-end tests (npm run test:e2e) need a
      # browser and run locally.
      - name: Test
        run: npm test

      - name: Build
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: simple-tracker-for-chatgpt
          path: dist/*.zip

      # Commits go straight to main, so the notes list commits rather than pull requests.
      - name: Write release notes
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='* %s (%h)' "${prev:+$prev..}HEAD"
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
