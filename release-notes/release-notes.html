<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release notes</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="release-notes.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <!-- The 128px icon, not the 48px one, so it stays sharp on screens scaled up to 300%. -->
      <img src="../icons/icon128.png" width="40" height="40" alt="">
      <div>
        <p id="product" class="product"></p>
        <h1>Release notes</h1>
      </div>
    </header>

    <p id="updated-from" class="updated-from" hidden></p>
    <div id="latest"></div>

    <section id="earlier" class="earlier" hidden>
      <h2>Earlier updates</h2>
      <div id="earlier-list"></div>
      <details id="older" class="older" hidden>
        <summary id="older-summary"></summary>
        <div id="older-list"></div>
      </details>
    </section>

    <footer class="page-footer">
      <label class="toggle">
        <input id="on-update" type="checkbox" checked>
        Open this page after updates
      </label>
      <a href="https://github.com/TheBabu/Simple-Usage-Tracker-for-ChatGPT/releases" target="_blank" rel="noopener">GitHub Releases</a>
    </footer>
  </main>

  <script src="../shared/changelog.js"></script>
  <script src="release-notes.js"></script>
</body>
</html>
