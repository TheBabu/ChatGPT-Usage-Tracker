<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Usage Tracker</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="cgut-root">
  <header class="popup-header">
    <div>
      <h1>ChatGPT Usage Tracker</h1>
      <!-- Says which way the numbers count, following the "Show usage" option. -->
      <p id="display-note" class="popup-subtitle"></p>
    </div>
    <span id="plan" class="popup-plan" hidden></span>
  </header>

  <main id="panel"></main>

  <footer class="popup-footer">
    <span id="updated"></span>
    <button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
      <!-- Material Icons "refresh" (Apache License 2.0). -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </footer>

  <section class="popup-options" aria-labelledby="options-heading">
    <h2 id="options-heading">Options</h2>
    <div class="popup-option">
      <span id="display-label">Show usage</span>
      <div class="segmented" role="radiogroup" aria-labelledby="display-label">
        <label><input type="radio" name="usage-display" value="used" checked><span>Used</span></label>
        <label><input type="radio" name="usage-display" value="left"><span>Left</span></label>
      </div>
    </div>
    <label class="popup-option">
      Usage bar in the message box
      <input id="show-bar" class="switch" type="checkbox" role="switch" checked>
    </label>
  </section>

  <!-- The Release notes link sits at the right end of the Debug line, and stays there when Debug opens. -->
  <div class="popup-extras">
    <a id="release-notes" class="popup-link" href="../release-notes/release-notes.html">Release notes</a>

    <details id="debug" class="popup-debug">
      <summary>Debug</summary>
      <div class="debug-actions">
        <button id="copy-debug" type="button">Copy</button>
        <button id="clear-log" type="button">Clear log</button>
      </div>
      <h2>Status</h2>
      <pre id="debug-status"></pre>
      <h2>Log</h2>
      <pre id="debug-log"></pre>
      <h2>Last response</h2>
      <pre id="debug-raw"></pre>
    </details>
  </div>

  <script src="../shared/usage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
