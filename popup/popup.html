<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Usage</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="cgut-root">
  <header class="popup-header">
    <h1>ChatGPT Usage</h1>
    <span id="plan" class="popup-plan" hidden></span>
  </header>

  <main id="panel"></main>

  <footer class="popup-footer">
    <span id="updated"></span>
    <button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5a7 7 0 1 0 7 7"/>
        <path d="M9.5 2.5 12 5l-2.5 2.5"/>
      </svg>
    </button>
  </footer>

  <details id="debug" class="popup-debug">
    <summary>Debug</summary>
    <div class="debug-actions">
      <button id="copy-debug" type="button">Copy</button>
      <button id="clear-log" type="button">Clear log</button>
    </div>
    <h2>Status</h2>
    <pre id="debug-status"></pre>
    <h2>Log</h2>
    <pre id="debug-log"></pre>
    <h2>Last response</h2>
    <pre id="debug-raw"></pre>
  </details>

  <script src="../shared/usage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
