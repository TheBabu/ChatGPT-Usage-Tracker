<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Usage</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="cgut-root">
  <header class="popup-header">
    <h1>ChatGPT Usage</h1>
    <span id="plan" class="popup-plan" hidden></span>
  </header>

  <main id="panel"></main>

  <footer class="popup-footer">
    <span id="updated"></span>
    <button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
      <!-- Material Icons "refresh" (Apache License 2.0). -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </footer>

  <details id="debug" class="popup-debug">
    <summary>Debug</summary>
    <div class="debug-actions">
      <button id="copy-debug" type="button">Copy</button>
      <button id="clear-log" type="button">Clear log</button>
    </div>
    <h2>Status</h2>
    <pre id="debug-status"></pre>
    <h2>Log</h2>
    <pre id="debug-log"></pre>
    <h2>Last response</h2>
    <pre id="debug-raw"></pre>
  </details>

  <script src="../shared/usage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
